name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build (net9.0 for Jellyfin 10.11, net10.0 for Jellyfin 12)
        run: dotnet build Jellyfin.Plugin.EpgStation -c Release -warnaserror
      - name: Check the page script
        run: node --check Jellyfin.Plugin.EpgStation/Web/app.js
      - name: Package
        run: python3 tools/package.py --base-url https://example.invalid --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: dist/*.zip
