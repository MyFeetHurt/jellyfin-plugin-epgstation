<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Plugin image (Jellyfin plugin card / catalog). PNG: tools/make_image.sh. Cards crop ~90 px off each side: keep content inside x 100..1180. -->
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0" r="1.2">
      <stop offset="0" stop-color="#1b2a44"/>
      <stop offset="0.55" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#080c16"/>
    </radialGradient>
    <linearGradient id="jf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aa5cc3"/>
      <stop offset="1" stop-color="#00a4dc"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- TV with a guide grid and a record dot -->
  <g transform="translate(170 170)">
    <rect x="0" y="0" width="420" height="290" rx="28" fill="#141c2e" stroke="url(#jf)" stroke-width="12"/>
    <g fill="#2a3a58">
      <rect x="40" y="44" width="100" height="56" rx="6"/><rect x="160" y="44" width="100" height="90" rx="6"/><rect x="280" y="44" width="100" height="40" rx="6"/>
      <rect x="40" y="114" width="100" height="70" rx="6"/><rect x="160" y="148" width="100" height="40" rx="6"/><rect x="280" y="98" width="100" height="90" rx="6"/>
      <rect x="40" y="198" width="100" height="50" rx="6"/><rect x="280" y="202" width="100" height="46" rx="6"/>
    </g>
    <rect x="160" y="202" width="100" height="46" rx="6" fill="#5a1418" stroke="#e53935" stroke-width="5"/>
    <rect x="150" y="306" width="120" height="16" rx="8" fill="url(#jf)"/>
    <circle cx="390" cy="262" r="62" fill="#0d1424"/>
    <circle cx="390" cy="262" r="50" fill="#fff"/>
    <circle cx="390" cy="262" r="34" fill="#e53935"/>
  </g>
  <text x="630" y="352" font-family="Noto Sans CJK JP, Noto Sans, sans-serif" font-weight="700" font-size="94" fill="#f2f4f8" letter-spacing="-2">EPGStation</text>
  <text x="634" y="430" font-family="Noto Sans CJK JP, Noto Sans, sans-serif" font-weight="700" font-size="54" fill="#00a4dc">for Jellyfin</text>
  <text x="636" y="500" font-family="Noto Sans CJK JP, sans-serif" font-size="32" fill="#8d97aa">録画予約 · Schedule recordings</text>
</svg>
