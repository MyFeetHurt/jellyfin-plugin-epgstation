<!doctype html>
<!-- Slide template for the demo video (rendered at 1920x1080 by record_demo.py). -->
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 30% 0%, #1b2a44 0%, #0d1424 55%, #080c16 100%);
    color: #f2f4f8; font-family: "Noto Sans CJK JP", "Noto Sans JP", sans-serif;
  }
  .wrap { position: absolute; left: 120px; right: 120px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  .logo { font-size: 128px; font-weight: 700; letter-spacing: -2px; margin: 0; }
  .logo b { color: #00a4dc; }
  h1 { font-size: 64px; font-weight: 700; margin: 0 0 10px; }
  .en { font-size: 34px; color: #8d97aa; margin: 0 0 28px; }
  .lead { font-size: 44px; margin: 28px 0 6px; }
  .lead-en { font-size: 28px; color: #8d97aa; }
  .url { display: inline-block; margin-top: 40px; font: 44px "Noto Sans Mono CJK JP", monospace; background: #00000080;
         border: 1px solid #2a3550; border-radius: 14px; padding: 18px 30px; color: #7fd3ff; }
  ul { list-style: none; padding: 0; margin: 20px 0 0; }
  li { position: relative; padding-left: 50px; margin: 0 0 22px; font-size: 46px; }
  li::before { content: ""; position: absolute; left: 6px; top: 24px; width: 18px; height: 18px; border-radius: 50%; background: #3d8bff; }
  li small { display: block; font-size: 27px; color: #8d97aa; margin-top: 2px; }
  .cols { display: flex; gap: 80px; align-items: center; }
  /* Phone bezel; build_video.py overlays the phone capture (444x960) at (1158, 60): bezel left = 1920 - 120 (wrap) - 180 - 480 = 1140, + 18 inset. */
  .phone-hole { position: absolute; right: 180px; top: 42px; width: 480px; height: 996px; box-sizing: border-box;
                border-radius: 56px; background: #000; border: 2px solid #3a4560; box-shadow: 0 30px 80px #0008; }
  .fade { animation: in .6s ease-out both; }
  @keyframes in { from { opacity: 0; transform: translateY(12px); } }
</style>
</head>
<body><div class="wrap fade" id="slot"></div></body>
</html>
